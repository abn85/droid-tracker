name: Check Droid Deals

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-deal:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Notify
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          CURRENT_DEAL=$(curl -s "https://gonk.tools/api/droid-alerts/limited-deal")
          echo "Fetched Deal: $CURRENT_DEAL"
          export CURRENT_DEAL
          python3 -c '
import os, json, urllib.request
webhook_url = os.environ["DISCORD_WEBHOOK"]
deal_text = os.environ["CURRENT_DEAL"]
data = {
    "embeds": [{
        "title": "🚨 New Droid Deal Alert! 🚨",
        "description": f"```json\n{deal_text}\n```",
        "color": 16761035
    }]
}
req = urllib.request.Request(
    webhook_url,
    data=json.dumps(data).encode("utf-8"),
    headers={"Content-Type": "application/json"}
)
try:
    urllib.request.urlopen(req)
    print("Python webhook sent successfully.")
except Exception as e:
    print(f"Failed to send webhook: {e}")
    exit(1)
'
