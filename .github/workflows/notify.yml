name: Check Droid Deals

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch:

jobs:
  check-deal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Deal Changes and Notify
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Fetch the current deal from the API
          CURRENT_DEAL=$(curl -s "https://gonk.tools/api/droid-alerts/limited-deal")
          
          echo "Fetched Deal: $CURRENT_DEAL"
          
          # Path to store the last seen deal inside the workflow runner
          CACHE_FILE=".last_deal.txt"
          
          # Read previous deal if the cache file exists
          if [ -f "$CACHE_FILE" ]; then
            PREVIOUS_DEAL=$(cat "$CACHE_FILE")
          else
            PREVIOUS_DEAL=""
          fi
          
          # Compare current deal with previous deal
          if [ "$CURRENT_DEAL" != "$PREVIOUS_DEAL" ]; then
            echo "Deal changed! Sending notification..."
            
            # Export variable so python can read it cleanly without bash escaping issues
            export CURRENT_DEAL
            
            # Send using a clean Discord Embed payload via python
            python3 -c '
import os, json, urllib.request

webhook_url = os.environ["DISCORD_WEBHOOK"]
deal_text = os.environ["CURRENT_DEAL"]

data = {
    "embeds": [{
        "title": "🚨 New Droid Deal Alert! 🚨",
        "description": f"```json\n{deal_text}\n```",
        "color": 16761035
    }]
}

req = urllib.request.Request(
    webhook_url,
    data=json.dumps(data).encode("utf-8"),
    headers={"Content-Type": "application/json"}
)

try:
    urllib.request.urlopen(req)
    print("Python webhook sent successfully.")
except Exception as e:
    print(f"Failed to send webhook: {e}")
    exit(1)
'
                 
            # Save the current deal to the cache file for future comparison
            echo "$CURRENT_DEAL" > "$CACHE_FILE"
            
            # Automatically commit the updated cache back to the repo so it persists across runs
            git config --global user.name "Deal Bot"
            git config --global user.email "bot@users.noreply.github.com"
            git add "$CACHE_FILE"
            git commit -m "Update last seen deal cache [skip ci]" || true
            git push || true
          else
            echo "No change in deal. Skipping notification."
          fi
          
