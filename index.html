<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Droid Tracker - Star Wars Droid Tycoon</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --accent-color: #3498db;
            --tab-bg: #2a2a2a;
        }

        body.theme-sith {
            --bg-color: #0d0d0d;
            --card-bg: #1a1010;
            --text-color: #f5e6e6;
            --border-color: #4a1515;
            --accent-color: #e74c3c;
            --tab-bg: #261212;
        }

        body.theme-jedi {
            --bg-color: #0f1410;
            --card-bg: #162018;
            --text-color: #e6f5ea;
            --border-color: #1e3b22;
            --accent-color: #2ecc71;
            --tab-bg: #1b291e;
        }

        body.theme-mandalorian {
            --bg-color: #141310;
            --card-bg: #1f1c16;
            --text-color: #f5f0e6;
            --border-color: #4a3b1e;
            --accent-color: #e67e22;
            --tab-bg: #29241b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        .app-header { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 480px; margin-bottom: 16px; position: relative; }
        .app-icon { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; margin-bottom: 8px; border: 2px solid var(--border-color); }
        .app-title { font-size: 20px; font-weight: 800; letter-spacing: 1px; color: #dcdcdc; margin-bottom: 12px; }

        .top-action-icons { position: absolute; top: 4px; right: 4px; display: flex; gap: 8px; }
        .icon-btn { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 10px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-color); font-size: 18px; }

        .dashboard-container { display: flex; gap: 12px; width: 100%; max-width: 480px; margin-bottom: 16px; }
        .dashboard-card { flex: 1; background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 14px; padding: 12px; display: flex; align-items: center; justify-content: space-between; }
        .dashboard-info { display: flex; flex-direction: column; }
        .dashboard-label { font-size: 11px; font-weight: 700; color: #888; letter-spacing: 0.5px; }
        .dashboard-value { font-size: 16px; font-weight: 700; color: #fff; margin-top: 2px; }
        .dashboard-pct { font-size: 12px; color: var(--accent-color); font-weight: 600; margin-top: 2px; }

        .progress-ring { width: 44px; height: 44px; transform: rotate(-90deg); }
        .progress-ring-bg { fill: none; stroke: var(--border-color); stroke-width: 4; }
        .progress-ring-fill { fill: none; stroke: var(--accent-color); stroke-width: 4; stroke-dasharray: 113.1; stroke-dashoffset: 113.1; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }

        .tabs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 480px; margin-bottom: 16px; }
        .tab-btn { border: 2px solid transparent; border-radius: 10px; padding: 10px 0; font-size: 12px; font-weight: 700; color: #fff; cursor: pointer; text-align: center; text-transform: uppercase; transition: transform 0.1s; }
        .tab-btn:active { transform: scale(0.96); }

        .btn-common { background-color: #27ae60; }
        .btn-rare { background-color: #2980b9; }
        .btn-epic { background-color: #8e44ad; }
        .btn-legendary { background-color: #d35400; }
        .btn-mythic { background-color: #c0392b; }
        .btn-iconic { background-color: #f1c40f; color: #121212 !important; }
        .btn-rebirth { background-color: #16a085; }
        .btn-deal { background-color: #e67e22; }

        .tab-content { display: none; width: 100%; max-width: 480px; flex-direction: column; gap: 10px; }
        .tab-content.active { display: flex; }

        .search-container { width: 100%; max-width: 480px; margin-bottom: 12px; display: none; }
        .search-input { width: 100%; background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 10px; padding: 10px 14px; color: var(--text-color); font-size: 14px; outline: none; }
        .search-input:focus { border-color: var(--accent-color); }
                .droid-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; position: relative; }
        .droid-card.fully-completed { border-color: #2ecc71; }
        .droid-card.hidden-completed { display: none !important; }

        .droid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .droid-name { font-size: 15px; font-weight: 700; color: #fff; }

        .flawless-toggle-btn { background: transparent; border: none; cursor: pointer; padding: 2px; opacity: 0.3; transition: opacity 0.2s; }
        .droid-card.flawless-active .flawless-toggle-btn { opacity: 1; }
        .flawless-icon { width: 22px; height: 22px; object-fit: contain; }

        .variant-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        .variant-pill { background: #252525; border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 0; font-size: 10px; font-weight: 700; color: #777; cursor: pointer; text-align: center; }

        .variant-pill.active-default { background: #34495e; color: #fff; border-color: #2c3e50; }
        .variant-pill.active-gold { background: #f39c12; color: #121212; border-color: #d68910; }
        .variant-pill.active-diamond { background: #00cec9; color: #121212; border-color: #01a3a4; }
        .variant-pill.active-rainbow { background: linear-gradient(135deg, #ff7675, #ffeaa7, #55efc4, #74b9ff, #a29bfe); color: #121212; border-color: #b2bec3; }
        .variant-pill.active-beskar { background: #b2bec3; color: #121212; border-color: #636e72; }
        .variant-pill.active-galactic { background: #6c5ce7; color: #fff; border-color: #4834d4; }

        .settings-modal, .lightbox-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .settings-content { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 420px; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-height: 90vh; overflow-y: auto; }
        .settings-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 800; color: #fff; }
        .settings-close { background: transparent; border: none; color: #aaa; font-size: 22px; cursor: pointer; }

        .settings-section { display: flex; flex-direction: column; gap: 8px; }
        .settings-section-title { font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase; }
        .theme-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .theme-btn { background: #252525; border: 2px solid var(--border-color); border-radius: 10px; padding: 10px; color: #fff; font-weight: 700; cursor: pointer; text-align: center; font-size: 13px; }
        
        .settings-option-row { display: flex; justify-content: space-between; align-items: center; background: #252525; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; color: #fff; }
        .settings-btn-row { display: flex; gap: 8px; }
        .settings-action-btn { flex: 1; background: #34495e; border: none; border-radius: 8px; padding: 10px; color: #fff; font-weight: 700; cursor: pointer; font-size: 13px; text-align: center; }
        .settings-action-btn.danger { background: #c0392b; }

        .lightbox-content { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 10px; }
        .lightbox-close { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.5); border: none; color: #fff; font-size: 28px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="app-header">
        <img src="icon.png" alt="App Icon" class="app-icon" id="app-theme-icon">
        <span class="app-title">DROID TRACKER</span>
        <div class="top-action-icons">
            <div class="icon-btn" onclick="toggleSearch()" title="Search Droids">&#128269;</div>
            <div class="icon-btn" onclick="openSettings()" title="Settings">&#9881;</div>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="dashboard-card">
            <div class="dashboard-info">
                <span class="dashboard-label">DROIDS</span>
                <span class="dashboard-value" id="progress-counter">0 / 380</span>
                <span class="dashboard-pct" id="variants-pct">0%</span>
            </div>
            <svg class="progress-ring" viewBox="0 0 40 40">
                <circle class="progress-ring-bg" cx="20" cy="20" r="18"></circle>
                <circle class="progress-ring-fill" id="variants-ring-fill" cx="20" cy="20" r="18"></circle>
            </svg>
        </div>
        <div class="dashboard-card">
            <div class="dashboard-info">
                <span class="dashboard-label">FLAWLESS</span>
                <span class="dashboard-value" id="flawless-counter">0 / 62</span>
                <span class="dashboard-pct" id="flawless-pct">0%</span>
            </div>
            <svg class="progress-ring" viewBox="0 0 40 40">
                <circle class="progress-ring-bg" cx="20" cy="20" r="18"></circle>
                <circle class="progress-ring-fill" id="flawless-ring-fill" cx="20" cy="20" r="18"></circle>
            </svg>
        </div>
    </div>

    <div class="tabs-grid">
        <button class="tab-btn btn-common active" onclick="switchTab(event, 'commonTab')">Common</button>
        <button class="tab-btn btn-rare" onclick="switchTab(event, 'rareTab')">Rare</button>
        <button class="tab-btn btn-epic" onclick="switchTab(event, 'epicTab')">Epic</button>
        <button class="tab-btn btn-legendary" onclick="switchTab(event, 'legendaryTab')">Legendary</button>
        <button class="tab-btn btn-mythic" onclick="switchTab(event, 'mythicTab')">Mythic</button>
        <button class="tab-btn btn-iconic" onclick="switchTab(event, 'iconicTab')">Iconic</button>
        <button class="tab-btn btn-rebirth" onclick="switchTab(event, 'rebirthTab')">Rebirth</button>
        <button class="tab-btn btn-deal" onclick="switchTab(event, 'dealTab')">Limited Deal</button>
    </div>

    <div class="search-container" id="search-container-wrapper">
        <input type="text" id="droid-search" class="search-input" placeholder="Search droids by name..." oninput="filterDroids(this.value)">
    </div>

    <div id="commonTab" class="tab-content active"><div id="common-container" style="display:flex; flex-direction:column; gap:10px;"></div></div>
    <div id="rareTab" class="tab-content"><div id="rare-container" style="display:flex; flex-direction:column; gap:10px;"></div></div>
    <div id="epicTab" class="tab-content"><div id="epic-container" style="display:flex; flex-direction:column; gap:10px;"></div></div>
    <div id="legendaryTab" class="tab-content"><div id="legendary-container" style="display:flex; flex-direction:column; gap:10px;"></div></div>
    <div id="mythicTab" class="tab-content"><div id="mythic-container" style="display:flex; flex-direction:column; gap:10px;"></div></div>
    <div id="iconicTab" class="tab-content"><div id="iconic-container" style="display:flex; flex-direction:column; gap:10px;"></div></div>
    
    <div id="rebirthTab" class="tab-content">
        <div class="droid-card" style="align-items: center; text-align: center; padding: 20px;">
            <span class="droid-name" style="font-size: 18px;">Super Rebirth Progress</span>
            <div style="display: flex; align-items: center; gap: 16px; margin: 10px 0;">
                <button class="icon-btn" onclick="adjustSuperRebirth(-1)" style="width: 44px; height: 44px; font-size: 22px;">-</button>
                <span id="sr-count" style="font-size: 28px; font-weight: 800; color: #fff;">0</span>
                <button class="icon-btn" onclick="adjustSuperRebirth(1)" style="width: 44px; height: 44px; font-size: 22px;">+</button>
            </div>
            <span id="cycle-display" style="font-size: 14px; color: var(--accent-color); font-weight: 700; margin-bottom: 10px;">Current: Cycle 1</span>
            <img id="active-cycle-img" src="rebirth-1.png" alt="Active Rebirth Cycle" style="width: 100%; max-width: 280px; border-radius: 10px; border: 2px solid var(--border-color); cursor: pointer;" onclick="openLightbox(this)">
            
            <span class="droid-name" style="font-size: 15px; margin-top: 15px;">Other Cycles</span>
            <div id="other-cycles-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-top: 5px;"></div>
        </div>
    </div>

    <div id="dealTab" class="tab-content">
        <div class="droid-card" style="align-items: center; text-align: center; padding: 20px;">
            <span class="droid-name" style="font-size: 18px;">Limited Deal</span>
            <div id="deal-info-container" style="font-size: 14px; color: #fff; margin: 10px 0; font-weight: 600;">Loading live deal...</div>
            <div id="deal-timer" style="font-size: 20px; font-weight: 800; color: var(--accent-color); letter-spacing: 1px;">--:--:--</div>
        </div>
    </div>

    <div class="settings-modal" id="settings-modal" onclick="closeSettingsOnBackdrop(event)">
        <div class="settings-content">
            <div class="settings-header">
                <span>Settings</span>
                <button class="settings-close" onclick="closeSettings()">&times;</button>
            </div>
            <div class="settings-section">
                <span class="settings-section-title">Theme Selection</span>
                <div class="theme-buttons">
                    <button class="theme-btn" id="theme-default" onclick="setTheme('default')">Default</button>
                    <button class="theme-btn" id="theme-sith" onclick="setTheme('sith')">Sith</button>
                    <button class="theme-btn" id="theme-jedi" onclick="setTheme('jedi')">Jedi</button>
                    <button class="theme-btn" id="theme-mandalorian" onclick="setTheme('mandalorian')">Mandalorian</button>
                </div>
            </div>
            <div class="settings-section">
                <span class="settings-section-title">Preferences</span>
                <div class="settings-option-row">
                    <span>Hide Completed Droids</span>
                    <input type="checkbox" id="hide-completed-toggle" onchange="toggleHideCompleted(this)" style="width: 20px; height: 20px; accent-color: var(--accent-color); cursor: pointer;">
                </div>
                <div class="settings-option-row">
                    <span>Limited Deal Notifications</span>
                    <input type="checkbox" id="deal-notifications-toggle" onchange="toggleDealNotifications(this)" style="width: 20px; height: 20px; accent-color: var(--accent-color); cursor: pointer;">
                </div>
            </div>
            <div class="settings-section">
                <span class="settings-section-title">Data Backup & Recovery</span>
                <div class="settings-btn-row">
                    <button class="settings-action-btn" onclick="exportDataFile()">Export Backup</button>
                    <button class="settings-action-btn" onclick="triggerImportFile()">Import Backup</button>
                    <input type="file" id="import-file-input" style="display:none" accept=".json" onchange="importDataFile(event)">
                </div>
                <span id="backup-status-text" style="font-size: 11px; color: #888; text-align: center; margin-top: 4px;">Last Exported: Never</span>
            </div>
            <div class="settings-section">
                <span class="settings-section-title">Danger Zone</span>
                <div class="settings-btn-row">
                    <button class="settings-action-btn danger" onclick="confirmResetData()">Reset All Progress</button>
                </div>
            </div>
        </div>
    </div>

    <div class="lightbox-modal" id="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close">&times;</button>
        <img class="lightbox-content" id="lightbox-img">
    </div>
        <script>
        const APP_VERSION = "2.8.3";
        if (localStorage.getItem('appVersion') !== APP_VERSION) {
            localStorage.setItem('appVersion', APP_VERSION);
            if (!window.location.search.includes('v=')) {
                window.location.replace(window.location.pathname + '?v=' + Date.now());
            }
        }

        const droidsData = {
            common: ["MOUSE", "PIT", "GONK", "CB", "R3", "R5", "R8", "IMPERIAL PROBE", "B1 BATTLE", "DRK-1 PROBE", "ID10"],
            rare: ["BDX EXPLORER", "ARG", "SENATE HOVERCAM", "B-U4D", "BAL-CORE", "ROLL-R", "2BB", "A-LT", "R4", "R9", "B1 SECURITY", "NAV-EX", "VECT-ARM", "HOV-R"],
            epic: ["GROUNDMECH", "LO", "AMP WALKER", "SEN-TRI", "OPTI-POD", "GUNRUNNER", "BB", "R2", "R6", "TRAK-R", "ORB-WALKER", "UTIL-TEC", "B1 HEAVY", "B2 SUPER", "B2 HEAVY", "STRIKE-ORB", "HAUL-R", "LNG-SHOT"],
            legendary: ["PROTO-ROLLER", "MECHA-DROID", "MONO-WLKR", "BB9", "R7", "B2-RP", "CYCLO-GRAV", "OPTI-STRK"],
            mythic: ["SNOW MOUSE", "RIC", "LOADLIFTER", "LEP", "RIC-1200", "DRFT-R", "CYCLENS", "MO-TRAK", "TRI-TEK", "IG", "KX"],
            iconic: ["DJ R-3X", "C-3PO", "BB-8", "CB-23", "R2-D2", "CHOPPER", "MISTER BONES", "IG-11 MARSHALL"]
        };

        const variants = [
            { id: 'default', label: 'DEF', class: 'active-default' },
            { id: 'gold', label: 'GOLD', class: 'active-gold' },
            { id: 'diamond', label: 'DIA', class: 'active-diamond' },
            { id: 'rainbow', label: 'RNB', class: 'active-rainbow' },
            { id: 'beskar', label: 'BSK', class: 'active-beskar' },
            { id: 'galactic', label: 'GAL', class: 'active-galactic' }
        ];

        let currentDealEndsAt = null;
        let lastDealSignature = null;
        let dealTimerInterval = null;

        function setTheme(themeName) {
            document.body.className = '';
            if (themeName !== 'default') {
                document.body.classList.add(`theme-${themeName}`);
            }
            localStorage.setItem('appTheme', themeName);

            const themeIcon = document.getElementById('app-theme-icon');
            if (themeIcon) {
                if (themeName === 'sith') {
                    themeIcon.src = 'icon-sith.png';
                } else if (themeName === 'jedi') {
                    themeIcon.src = 'icon-jedi.png';
                } else if (themeName === 'mandalorian') {
                    themeIcon.src = 'icon-mandalorian.png';
                } else {
                    themeIcon.src = 'icon.png';
                }
            }

            document.querySelectorAll('.theme-btn').forEach(btn => btn.style.borderColor = 'var(--border-color)');
            const activeBtn = document.getElementById(`theme-${themeName}`);
            if (activeBtn) activeBtn.style.borderColor = 'var(--accent-color)';
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('appTheme') || 'default';
            setTheme(savedTheme);
        }
                function toggleHideCompleted(checkbox) {
            localStorage.setItem('hide-completed', checkbox.checked ? 'true' : 'false');
            applyHideCompletedFilter();
        }

        function toggleDealNotifications(checkbox) {
            if (checkbox.checked) {
                if (Notification.permission === 'granted') {
                    localStorage.setItem('deal-notifications', 'true');
                } else if (Notification.permission !== 'denied') {
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            localStorage.setItem('deal-notifications', 'true');
                        } else {
                            checkbox.checked = false;
                            localStorage.setItem('deal-notifications', 'false');
                            alert('Notification permission was denied.');
                        }
                    });
                } else {
                    checkbox.checked = false;
                    localStorage.setItem('deal-notifications', 'false');
                    alert('Notifications are blocked in your browser settings.');
                }
            } else {
                localStorage.setItem('deal-notifications', 'false');
            }
        }

        function fetchLiveDeal() {
            const targetUrl = 'https://gonk.tools/api/droid-alerts/limited-deal';
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);

            fetch(proxyUrl)
                .then(res => res.json())
                .then(data => {
                    const deal = data.deal || data;
                    if (!deal) return;

                    const infoContainer = document.getElementById('deal-info-container');
                    let dealText = JSON.stringify(deal);
                    if (deal.mutation) {
                        dealText = `Active Deal: ${deal.mutation}`;
                    }
                    infoContainer.innerText = dealText;

                    currentDealEndsAt = deal.endsAt ? new Date(deal.endsAt).getTime() : null;

                    const newSignature = JSON.stringify(deal);
                    if (lastDealSignature && lastDealSignature !== newSignature) {
                        if (localStorage.getItem('deal-notifications') === 'true' && Notification.permission === 'granted') {
                            new Notification('Limited Deal Changed!', {
                                body: dealText,
                                icon: 'icon.png'
                            });
                        }
                    }
                    lastDealSignature = newSignature;
                })
                .catch(err => {
                    const infoContainer = document.getElementById('deal-info-container');
                    if (infoContainer) {
                        infoContainer.innerText = 'Failed to load live deal.';
                    }
                });
        }

        function updateDealTimer() {
            if (!currentDealEndsAt) return;
            const now = new Date().getTime();
            const distance = currentDealEndsAt - now;
            const timerEl = document.getElementById('deal-timer');

            if (distance < 0) {
                timerEl.innerText = 'EXPIRED';
                fetchLiveDeal();
                return;
            }

            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            timerEl.innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
                function isCardFullyCompleted(card) {
            const iconicBtn = card.querySelector('.variant-pill[data-key*="iconic"]');
            if (iconicBtn) {
                return iconicBtn.classList.contains('active-gold');
            } else {
                const pills = card.querySelectorAll('.variant-pill');
                const allPillsChecked = Array.from(pills).every(p => {
                    const activeClass = p.getAttribute('data-activeclass');
                    return p.classList.contains(activeClass);
                });
                const isFlawlessActive = card.classList.contains('flawless-active');
                return allPillsChecked && isFlawlessActive;
            }
        }

        function applyHideCompletedFilter() {
            const hideCompleted = localStorage.getItem('hide-completed') === 'true';
            const cards = document.querySelectorAll('.droid-card');

            cards.forEach(card => {
                const completed = isCardFullyCompleted(card);
                
                if (completed) {
                    card.classList.add('fully-completed');
                } else {
                    card.classList.remove('fully-completed');
                }

                if (hideCompleted && completed) {
                    card.classList.add('hidden-completed');
                } else {
                    card.classList.remove('hidden-completed');
                }
            });
        }

        function buildTrackers() {
            for (const [rarity, list] of Object.entries(droidsData)) {
                const container = document.getElementById(`${rarity}-container`);
                if (!container) continue;

                list.forEach(droidName => {
                    const slug = droidName.toLowerCase().replace(/[^a-z0-9]/g, '');
                    const card = document.createElement('div');
                    card.className = 'droid-card';
                    card.setAttribute('data-search-name', droidName.toLowerCase().replace(/[\s-]/g, ''));

                    if (rarity === 'iconic') {
                        const iconicKey = `iconic-${slug}-owned`;
                        const isOwned = localStorage.getItem(iconicKey) === 'true';
                        const activeClass = isOwned ? 'active-gold' : '';

                        card.innerHTML = `
                            <div class="droid-header" style="margin-bottom:0;">
                                <span class="droid-name">${droidName}</span>
                                <button class="variant-pill ${activeClass}" data-key="${iconicKey}" onclick="toggleIconic(this)">Obtained</button>
                            </div>
                        `;
                    } else {
                        let variantsHtml = '';
                        variants.forEach(v => {
                            const key = `${rarity}-${slug}-${v.id}`;
                            const isSaved = localStorage.getItem(key) === 'true';
                            const activeClass = isSaved ? v.class : '';
                            variantsHtml += `<button class="variant-pill ${activeClass}" data-key="${key}" data-activeclass="${v.class}" onclick="toggleVariant(this)">${v.label}</button>`;
                        });

                        const flawlessKey = `${rarity}-${slug}-flawless`;
                        const isFlawless = localStorage.getItem(flawlessKey) === 'true';
                        if (isFlawless) {
                            card.classList.add('flawless-active');
                        }

                        card.innerHTML = `
                            <div class="droid-header">
                                <span class="droid-name">${droidName}</span>
                                <button class="flawless-toggle-btn" data-key="${flawlessKey}" onclick="toggleFlawlessIcon(this)" title="Toggle Flawless">
                                    <img src="icon-flawless.png" alt="Flawless Icon" class="flawless-icon">
                                </button>
                            </div>
                            <div class="variant-grid">${variantsHtml}</div>
                        `;
                    }
                    container.appendChild(card);
                });
            }
            updateCounters();
            loadSuperRebirthData();
            applyHideCompletedFilter();
        }

        function toggleSearch() {
            const searchContainer = document.getElementById('search-container-wrapper');
            const searchInput = document.getElementById('droid-search');
            if (searchContainer.style.display === 'block') {
                searchContainer.style.display = 'none';
                searchInput.value = '';
                filterDroids('');
            } else {
                searchContainer.style.display = 'block';
                searchInput.focus();
            }
        }

        function filterDroids(query) {
            const cleanQuery = query.toLowerCase().replace(/[\s-]/g, '').trim();
            const cards = document.querySelectorAll('.droid-card');
            
            if (cleanQuery === '') {
                cards.forEach(card => card.style.display = 'block');
                applyHideCompletedFilter();
                return;
            }

            document.querySelectorAll('.tab-content:not(#rebirthTab):not(#dealTab)').forEach(c => c.classList.add('active'));
            cards.forEach(card => {
                const searchName = card.getAttribute('data-search-name');
                card.style.display = (searchName && searchName.startsWith(cleanQuery)) ? 'block' : 'none';
            });
        }
                function updateCounters() {
            let variantObtained = 0;
            let variantTotal = 0;
            let flawlessObtained = 0;
            let flawlessTotal = 62;
            const circumference = 113.1;

            for (const [rarity, list] of Object.entries(droidsData)) {
                let categoryObtained = 0;
                let categoryTotal = 0;

                list.forEach(droidName => {
                    const slug = droidName.toLowerCase().replace(/[^a-z0-9]/g, '');
                    if (rarity === 'iconic') {
                        variantTotal++; categoryTotal++;
                        if (localStorage.getItem(`iconic-${slug}-owned`) === 'true') {
                            variantObtained++; categoryObtained++;
                        }
                    } else {
                        variants.forEach(v => {
                            variantTotal++; categoryTotal++;
                            if (localStorage.getItem(`${rarity}-${slug}-${v.id}`) === 'true') {
                                variantObtained++; categoryObtained++;
                            }
                        });
                        categoryTotal++;
                        if (localStorage.getItem(`${rarity}-${slug}-flawless`) === 'true') {
                            flawlessObtained++; categoryObtained++;
                        }
                    }
                });

                const tabBtn = document.querySelector(`.btn-${rarity}`);
                if (tabBtn) {
                    if (categoryObtained === categoryTotal && categoryTotal > 0) {
                        tabBtn.style.border = '2px solid #2ecc71';
                    } else {
                        tabBtn.style.border = '2px solid transparent';
                    }
                }
            }

            document.getElementById('progress-counter').innerText = `${variantObtained} / ${variantTotal}`;
            const variantPct = Math.round((variantObtained / variantTotal) * 100);
            document.getElementById('variants-pct').innerText = `${variantPct}%`;
            document.getElementById('variants-ring-fill').style.strokeDashoffset = circumference - (circumference * variantPct) / 100;

            document.getElementById('flawless-counter').innerText = `${flawlessObtained} / ${flawlessTotal}`;
            const flawlessPct = Math.round((flawlessObtained / flawlessTotal) * 100);
            document.getElementById('flawless-pct').innerText = `${flawlessPct}%`;
            document.getElementById('flawless-ring-fill').style.strokeDashoffset = circumference - (circumference * flawlessPct) / 100;

            applyHideCompletedFilter();
        }

        function loadSuperRebirthData() {
            let srCount = parseInt(localStorage.getItem('super-rebirth-count')) || 0;
            updateSuperRebirthUI(srCount);
        }

        function adjustSuperRebirth(amount) {
            let srCount = parseInt(localStorage.getItem('super-rebirth-count')) || 0;
            srCount += amount;
            if (srCount < 0) srCount = 0;
            localStorage.setItem('super-rebirth-count', srCount);
            updateSuperRebirthUI(srCount);
        }

        function updateSuperRebirthUI(srCount) {
            document.getElementById('sr-count').innerText = srCount;
            let currentCycle = (srCount % 4) + 1;
            document.getElementById('cycle-display').innerText = `Current: Cycle ${currentCycle}`;
            document.getElementById('active-cycle-img').src = `rebirth-${currentCycle}.png`;

            const otherGrid = document.getElementById('other-cycles-grid');
            otherGrid.innerHTML = '';
            for (let i = 1; i <= 4; i++) {
                if (i !== currentCycle) {
                    const img = document.createElement('img');
                    img.src = `rebirth-${i}.png`;
                    img.onclick = function() { openLightbox(this); };
                    otherGrid.appendChild(img);
                }
            }
        }

        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
        function closeSettingsOnBackdrop(event) { if (event.target.id === 'settings-modal') closeSettings(); }

        function exportDataFile() {
            const dataObj = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                dataObj[key] = localStorage.getItem(key);
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataObj, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "droid-tracker-backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();

            const now = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            localStorage.setItem('last-exported', now);
            updateBackupStatusUI();
        }

        function triggerImportFile() {
            document.getElementById('import-file-input').click();
        }

        function importDataFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const dataObj = JSON.parse(e.target.result);
                    localStorage.clear();
                    for (const [key, value] of Object.entries(dataObj)) {
                        localStorage.setItem(key, value);
                    }
                    location.reload();
                } catch (err) {
                    alert('Invalid backup file format.');
                }
            };
            reader.readAsText(file);
        }

        function updateBackupStatusUI() {
            const lastExported = localStorage.getItem('last-exported');
            const statusText = document.getElementById('backup-status-text');
            if (statusText) {
                statusText.innerText = lastExported ? `Last Exported: ${lastExported}` : 'Last Exported: Never';
            }
        }

        function confirmResetData() {
            if (confirm("Are you sure you want to reset all your droid progress? This cannot be undone unless you have an exported backup!")) {
                localStorage.clear();
                location.reload();
            }
        }
                function toggleVariant(btn) {
            const key = btn.getAttribute('data-key');
            const activeClass = btn.getAttribute('data-activeclass');
            if (btn.classList.contains(activeClass)) {
                btn.classList.remove(activeClass);
                localStorage.setItem(key, 'false');
            } else {
                btn.classList.add(activeClass);
                localStorage.setItem(key, 'true');
            }
            btn.blur();
            updateCounters();
        }

        function toggleIconic(btn) {
            const key = btn.getAttribute('data-key');
            if (btn.classList.contains('active-gold')) {
                btn.classList.remove('active-gold');
                localStorage.setItem(key, 'false');
            } else {
                btn.classList.add('active-gold');
                localStorage.setItem(key, 'true');
            }
            btn.blur();
            updateCounters();
        }

        function toggleFlawlessIcon(btn) {
            const card = btn.closest('.droid-card');
            const key = btn.getAttribute('data-key');
            card.classList.toggle('flawless-active');
            const isFlawless = card.classList.contains('flawless-active');
            localStorage.setItem(key, isFlawless);
            btn.blur();
            updateCounters();
        }

        function switchTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function openLightbox(element) {
            document.getElementById('lightbox').style.display = 'flex';
            document.getElementById('lightbox-img').src = element.src;
        }

        function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }

        window.onload = function() {
            loadTheme();

            if (localStorage.getItem('hide-completed') === 'true') {
                const hideToggle = document.getElementById('hide-completed-toggle');
                if (hideToggle) hideToggle.checked = true;
            }

            if (localStorage.getItem('deal-notifications') === 'true') {
                const notifToggle = document.getElementById('deal-notifications-toggle');
                if (notifToggle) notifToggle.checked = true;
            }

            updateBackupStatusUI();
            buildTrackers();

            fetchLiveDeal();
            setInterval(fetchLiveDeal, 30000); // Check every 30 seconds for live updates
            dealTimerInterval = setInterval(updateDealTimer, 1000);
        };
    </script>
</body>
